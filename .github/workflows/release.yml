name: Release verification and publish

# Verifies a release candidate on the exact revision being shipped, and publishes
# that revision to npm when it arrives as a `v*` tag.
#
# The order matters and is not negotiable: verification runs first on the same
# commit, its receipt is carried into the publish job, and the publish job refuses
# to run without it. Three gates stand between a tag and a registry, and the publish
# job depends on all of them by job id, so a failing one cannot be published past:
#
#   * `scripts/verify-release.mjs` — clean worktree, SRI that hashes to the shipped
#     bytes, a suite with no failures, both byte budgets, the CI gates, the publish
#     allowlist and a byte-identical rebuild, all recorded in
#     reports/release-verification.json;
#   * `npm run test:containers -- --compose deploy/docker-compose.prod.yml` on both
#     released architectures — the deployed runtime's own posture, verified against the
#     file an operator deploys: UID 1000 under dropped capabilities, sentinel files that
#     survive container replacement, a SIGKILL classified as an unclean shutdown and a
#     renderer that keeps its sandbox, each on native hardware;
#   * `scripts/publish-preflight.mjs` — the decisions a pipeline must not make for
#     the owner (a license file and a `license` field), the access and provenance
#     settings, and the tag agreeing with package.json.
#
# Provenance is requested with `--provenance`, which requires this repository to be
# PUBLIC and the job to hold `id-token: write`; npm then publishes a signed
# attestation tying the tarball to this workflow run. Publishing needs a
# `NPM_TOKEN` secret (an automation token) unless the package is configured for npm
# trusted publishing, in which case the token can be removed and OIDC used alone.
#
# The `environment: release` on the publish job is deliberate: add required
# reviewers to that environment in repository settings and every publish waits for
# a human, which is the right shape for the one action here that cannot be undone.
#
# A tag push re-runs verification with create_tag=false, so the tag cannot be
# created twice and the two triggers cannot loop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create and push the annotated v<package version> tag when verification passes'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  verify-release:
    name: Verify release (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The version tag and its commit have to be visible for the tag check.
          fetch-depth: 0

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Cache the pinned Chromium build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build release artifacts
        run: npm run build

      # The documented command, not a copy of what it expands to: `npm run verify:release`
      # is what a maintainer runs in this checkout, so the job runs the same entry point
      # and a script that stopped working locally would stop working here too.
      - name: Verify the release
        env:
          CREATE_TAG: ${{ inputs.create_tag }}
        run: |
          if [ "$CREATE_TAG" = "true" ]; then
            npm run verify:release -- --tag
          else
            npm run verify:release
          fi

      - name: Push the created tag
        if: ${{ inputs.create_tag == true }}
        run: git push origin "v$(node -p "require('./package.json').version")"

      # The receipt is the publish job's evidence, so it travels with the artifacts
      # rather than being trusted to exist in another runner's filesystem.
      - name: Upload the verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: |
            reports/release-verification.json
            reports/build.json
            reports/ci-timing.json
            test-results/
          if-no-files-found: warn

  # Container verification is a publish gate rather than an advisory job: the runtime this
  # release ships is the image, and the properties that matter are only visible in a
  # running container, under the deployment's own restrictions. It verifies
  # deploy/docker-compose.prod.yml — the file an operator actually deploys — rather than
  # the local one, and both released architectures are checked on their own hardware,
  # because a cross-built image runs Chromium under emulation, where the renderer sandbox
  # layers the verifier requires do not exist and the gate would refuse a run that proves
  # nothing about the target.
  verify-containers:
    name: Verify the container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      # The verifier compares the bytes the container serves with the artifacts in this
      # checkout, so the same sources have to be built here.
      - name: Build release artifacts
        run: npm run build

      - name: Build the image natively for ${{ matrix.platform }}
        run: docker build --platform '${{ matrix.platform }}' --progress=plain -t navi:local .

      # Emulation would make every lifecycle and sandbox result describe a different
      # runtime than the one being shipped, so the image's own architecture is asserted
      # rather than assumed from the runner label.
      - name: Assert the image matches the runner's architecture
        run: |
          image_arch="$(docker image inspect navi:local --format '{{.Architecture}}')"
          runner_arch="$(uname -m)"
          case "$runner_arch" in
            x86_64) runner_arch=amd64 ;;
            aarch64|arm64) runner_arch=arm64 ;;
          esac
          echo "image=$image_arch runner=$runner_arch"
          test "$image_arch" = "$runner_arch"

      # The shipped production file, verified against the image just built here: its
      # required credentials, its bind address, its volume mounts and its seccomp profile
      # are all resolved from deploy/, which is the file a deployment runs.
      - name: Verify the production container, its lifecycle state and the sandbox
        run: npm run test:containers -- --compose deploy/docker-compose.prod.yml

      # The verifier names its receipt for the deployment configuration it proves, so the
      # release gate uploads the production receipt rather than the local one.
      - name: Upload the container verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-container-receipt-${{ matrix.arch }}
          path: reports/production-container-verification.json
          if-no-files-found: warn

  publish:
    name: Publish to npm (Node 22.x)
    # Both gates by job id: a release whose container verification failed - a service
    # running with capabilities it should not have, sentinels that did not survive a
    # restart, a renderer without its sandbox - never reaches the registry.
    needs: [verify-release, verify-containers]
    # Only a tag push publishes. A dispatched run may create and push the tag, and
    # that push starts its own verified run of this job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      # Required by `npm publish --provenance`: the OIDC token that signs the
      # attestation binding this tarball to this workflow run.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.x for the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Download the verification receipt
        uses: actions/download-artifact@v4
        with:
          name: release-receipt
          path: reports

      # The container receipts are the evidence for the runtime posture this release
      # claims, so they travel into the published record beside the release receipt.
      - name: Download the container verification receipts
        uses: actions/download-artifact@v4
        with:
          pattern: release-container-receipt-*
          path: reports/container-verification

      - name: Rebuild the artifacts from the tagged sources
        run: npm run build

      - name: Refuse to publish without a license decision and a passing receipt
        run: npm run publish:preflight -- --tag "$TAG"

      - name: Assert the tarball matches package.json's allowlist
        run: npm run pack:check --silent

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Generate release notes from the receipts
        run: npm run release:notes -- --tag "$TAG" --out reports/release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file reports/release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file reports/release-notes.md \
              --verify-tag
          fi

      - name: Upload the published record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publish
          path: |
            reports/release-notes.md
            reports/release-verification.json
            reports/build.json
            reports/container-verification/**
          if-no-files-found: warn
